<style>
:root{--bg:#f3f6f7;--surface:#fff;--ink:#15232c;--muted:#5b6b75;--line:#d7e0e4;--accent:#1d5f86;--on-accent:#fff;--bad:#a63a32;
  --f:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme: dark){:root{--bg:#0f171c;--surface:#16222a;--ink:#e3ecf0;--muted:#94a6b0;--line:#2a3a44;--accent:#6fb3dc;--on-accent:#0f171c;--bad:#ee8f86}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f);display:grid;place-items:center;min-height:100vh;padding:16px}
.card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px 24px}
h1{font-size:20px;line-height:1.25;margin:0 0 4px}
.sub{margin:0 0 20px;color:var(--muted);font-size:14px}
label.f{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
input[type=password]{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input[type=password]:focus{outline:2px solid var(--accent);outline-offset:1px}
.rem{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);margin:14px 0 18px;cursor:pointer}
.rem input{width:16px;height:16px;margin:0;accent-color:var(--accent)}
button{width:100%;font:inherit;font-weight:600;padding:11px;border:0;border-radius:8px;background:var(--accent);color:var(--on-accent);cursor:pointer}
button:disabled{opacity:.6;cursor:progress}
.err{color:var(--bad);font-size:14px;margin:12px 0 0;min-height:1.5em}
</style>
</head>

        if (remember) {
          save(toB64(new Uint8Array(bits)));
          html += '<button id="kilit-unut" type="button" style="position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:60;'
            + 'font:500 12px/1 var(--f-body,system-ui);padding:7px 11px;border-radius:999px;border:1px solid var(--line,#ccc);'
            + 'background:var(--surface,#fff);color:var(--muted,#555);cursor:pointer;opacity:.85">Bu cihazda unut</button>'
            + '<script>document.getElementById("kilit-unut").onclick=function(){try{localStorage.removeItem(' + JSON.stringify(KEY) + ')}catch(e){}location.reload()};<\/script>';
        }
        return new Promise(function(res){
          function swap(){ document.open(); document.write(html); document.close(); res(); }
          if (document.readyState === 'complete') setTimeout(swap, 0);
          else window.addEventListener('load', function(){ setTimeout(swap, 0); }, { once: true });
        });
      });
  }

  var saved = load();
  if (saved) {
    form.style.visibility = 'hidden';
    unlock(fromB64(saved), true).catch(function(){ save(null); form.style.visibility = ''; });
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var p = pw.value.normalize('NFC');
    if (!p) return;
    go.disabled = true; go.textContent = 'Açılıyor…'; err.textContent = '';
    crypto.subtle.importKey('raw', new TextEncoder().encode(p), 'PBKDF2', false, ['deriveBits'])
      .then(function(k){ return crypto.subtle.deriveBits({ name: 'PBKDF2', salt: fromB64(P.salt), iterations: P.iter, hash: 'SHA-256' }, k, 256); })
      .then(function(bits){ return unlock(bits, rem.checked); })
      .catch(function(){
        go.disabled = false; go.textContent = 'Aç';
        err.textContent = 'Şifre yanlış.'; pw.select();
      });
  });
})();
</script>
</body>
</html>
