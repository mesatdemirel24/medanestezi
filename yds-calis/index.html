<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YDS Kelime Kartları</title>
<meta name="description" content="YDS için 60 kartlık, 1.800 kelimelik çalışma programı.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Literata:ital,opsz,wght@0,7..72,500;0,7..72,700;1,7..72,400&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout: a single exam-booklet column. Options are optical-form bubbles A–D;
   the answer panel reads like a dictionary entry written in blue ballpoint. */
:root {
  --paper: #f3f5f9;
  --sheet: #ffffff;
  --ink: #181c2b;
  --muted: #5b6377;
  --line: #d9deea;
  --pen: #2b3fa3;
  --pen-soft: #e7eafa;
  --on-pen: #ffffff;
  --good: #1d8248;
  --good-bg: #e2f3e8;
  --good-ink: #17663a;
  --bad: #c0352d;
  --bad-bg: #fbe5e3;
  --on-fill: #ffffff;
  --display: "Literata", Georgia, "Times New Roman", serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #11131a; --sheet: #191c26; --ink: #e7e9f1; --muted: #9aa1b6; --line: #2c3142;
    --pen: #93a5ff; --pen-soft: #222947; --on-pen: #0f1426;
    --good: #52c585; --good-bg: #163324; --good-ink: #93e2b3; --bad: #ff7f75; --bad-bg: #3c1c1c; --on-fill: #0e1210;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #11131a; --sheet: #191c26; --ink: #e7e9f1; --muted: #9aa1b6; --line: #2c3142;
  --pen: #93a5ff; --pen-soft: #222947; --on-pen: #0f1426;
  --good: #52c585; --good-bg: #163324; --good-ink: #93e2b3; --bad: #ff7f75; --bad-bg: #3c1c1c; --on-fill: #0e1210;
  color-scheme: dark;
}

body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2.5px solid var(--pen); outline-offset: 2px; }
.wrap { max-width: 680px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.page { padding-block: 28px 140px; display: grid; gap: 24px; }
.label { font-size: .72rem; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.btn { border: 1.5px solid var(--line); background: var(--sheet); border-radius: 10px; padding: 10px 16px; font-weight: 700; }
.btn:hover { border-color: var(--pen); }
.btn.primary { background: var(--pen); border-color: var(--pen); color: var(--on-pen); }
.btn:disabled { opacity: .45; cursor: default; }
.btn:disabled:hover { border-color: var(--line); }

/* Home */
.hero h1 { font-family: var(--display); font-size: clamp(2rem, 6vw, 2.8rem); line-height: 1.1; margin: 6px 0 10px; text-wrap: balance; }
.hero p { margin: 0; color: var(--muted); max-width: 60ch; }
.review { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.review b { font-variant-numeric: tabular-nums; }
.group { display: grid; gap: 10px; }
.group-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 12px; }
.group-head h2 { font-family: var(--display); font-size: 1.3rem; margin: 0; }
.group-head .count { font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.group-head p { margin: 0; width: 100%; color: var(--muted); font-size: .9rem; }
.rows { display: grid; background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; }
.rowc { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 12px 14px; border-top: 1px solid var(--line); }
.rowc:first-child { border-top: 0; }
.rowc .info { flex: 1; min-width: 170px; display: grid; gap: 5px; }
.rowc .name { font-weight: 700; }
.rowc .sub { font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.rowc .meter { max-width: 240px; }
.rowc .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.rowc .acts .btn { padding: 7px 13px; font-size: .92rem; }
.rowc.locked { color: var(--muted); }
.rowc.locked .name { font-weight: 400; }
.meter { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--pen); border-radius: 99px; }
.review .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.foot { font-size: .85rem; color: var(--muted); }

/* Quiz */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.bar .where { flex: 1; min-width: 0; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.back { border: 0; background: none; padding: 6px 8px 6px 0; color: var(--pen); font-weight: 700; }
.tally { font-variant-numeric: tabular-nums; font-weight: 700; display: flex; gap: 10px; }
.tally .ok { color: var(--good); } .tally .no { color: var(--bad); }
.track { height: 4px; background: var(--line); }
.track i { display: block; height: 100%; background: var(--pen); transition: width .3s ease; }

.qhead { display: grid; gap: 6px; }
.word { font-family: var(--display); font-weight: 700; font-size: clamp(2.3rem, 9vw, 3.5rem); line-height: 1.05; letter-spacing: -.01em; margin: 0; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; color: var(--muted); font-size: .92rem; }
.pos { font-style: italic; font-family: var(--display); }
.say { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--sheet); border-radius: 99px; padding: 4px 12px; font-size: .88rem; color: var(--pen); font-weight: 700; }
.say svg { width: 16px; height: 16px; }
.freq { font-variant-numeric: tabular-nums; border: 1px solid var(--line); border-radius: 99px; padding: 3px 10px; font-size: .82rem; }

.opts { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.opt { width: 100%; display: grid; grid-template-columns: 34px 1fr; align-items: center; gap: 14px; text-align: left; background: var(--sheet); border: 1.5px solid var(--line); border-radius: 12px; padding: 13px 14px; font-size: 1.04rem; transition: border-color .15s, background-color .15s, opacity .15s; }
.opt:hover:not(:disabled) { border-color: var(--pen); }
.opt:disabled { cursor: default; }
.bub { width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--pen); color: var(--pen); display: grid; place-items: center; font-weight: 700; font-size: .9rem; }
.opt.is-correct { border-color: var(--good); background: var(--good-bg); }
.opt.is-correct .bub { background: var(--good); border-color: var(--good); color: var(--on-fill); }
.opt.is-wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt.is-wrong .bub { background: var(--bad); border-color: var(--bad); color: var(--on-fill); }
.opt.is-dim { opacity: .5; }

.verdict { font-weight: 700; }
.verdict.ok { color: var(--good); } .verdict.no { color: var(--bad); }

.entry { background: var(--sheet); border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: grid; gap: 20px; }
.entry .mean { font-family: var(--display); font-size: 1.35rem; line-height: 1.3; margin: 4px 0 0; }
.sec { display: grid; gap: 8px; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1.5px solid var(--good); background: var(--good-bg); color: var(--good-ink); border-radius: 99px; padding: 4px 12px; font-size: .95rem; font-weight: 700; }
.uses { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.uses li { display: grid; gap: 2px; padding-left: 14px; border-left: 2px solid var(--line); }
.uses .pat { color: var(--pen); font-weight: 700; }
.uses .en { font-family: var(--display); font-style: italic; }
.uses .tr { color: var(--muted); font-size: .95rem; }
.keybox { background: var(--pen-soft); border-radius: 12px; padding: 14px 16px; display: grid; gap: 2px; }
.keybox b { font-family: var(--display); font-size: 1.15rem; color: var(--pen); }
.hint { font-family: var(--display); font-style: italic; font-size: 1.05rem; }
.entry p { margin: 0; max-width: 65ch; }

.nextbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--paper); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.nextbar .wrap { padding-block: 12px; display: flex; gap: 10px; align-items: center; }
.nextbar .btn { flex: 1; padding: 13px 16px; font-size: 1.02rem; }
.kbd { font-size: .8rem; color: var(--muted); }
@media (max-width: 520px) { .kbd { display: none; } }

/* Result */
.score { font-family: var(--display); font-size: clamp(3rem, 14vw, 4.6rem); font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; margin: 6px 0; }
.score small { font-size: .4em; color: var(--muted); font-weight: 500; }
.misses { list-style: none; margin: 0; padding: 0; display: grid; border: 1px solid var(--line); border-radius: 14px; background: var(--sheet); }
.misses li { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; padding: 12px 16px; border-top: 1px solid var(--line); }
.misses li:first-child { border-top: 0; }
.misses b { font-family: var(--display); }
.misses span { color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

<div id="app"></div>

<script>
/* Kart 1 — Birlikte çalıştığımız kelimeler.
   Alanlar: w kelime, p tür, a doğru anlam, x çeldiriciler, s eş anlamlılar, o zıt anlamlılar,
   e kullanımlar [kalıp, örnek, çeviri], k en akılda kalıcı kalıp, n YDS notu, m hatırlatıcı,
   f 2022–2025 arasındaki 9 YDS'nin kaçında geçtiği (Kelime Röntgeni). */
(window.YDS_CARDS = window.YDS_CARDS || {}).kart01 = {
  title: "Çalıştıklarımız",
  words: [
    { w: "assure", p: "fiil", a: "güvence vermek, temin etmek",
      x: ["sigortalamak", "ertelemek, geciktirmek", "küçümsemek, önemsememek"],
      s: ["guarantee", "promise", "reassure", "convince"],
      o: "alarm (telaşlandırmak), worry (endişelendirmek)",
      e: [["assure someone that…", "I assure you that everything will be fine.", "Sizi temin ederim, her şey yoluna girecek."],
          ["assure someone of something", "The doctor assured the patient of a quick recovery.", "Doktor hastaya hızla iyileşeceği konusunda güvence verdi."]],
      k: ["assure someone that…", "birine …dığına dair güvence vermek"],
      n: "Assure hep bir KİŞİYE söylenir. Şıklarda üçlü tuzak: ensure (bir şeyin olmasını sağlamak), insure (sigortalamak).",
      m: "a-SURE: içinde 'sure' (emin) var. Birine 'emin ol' demek, ona güvence vermektir." },

    { w: "ensure", p: "fiil", a: "sağlamak, garanti altına almak", f: 5,
      x: ["tahmin etmek", "abartmak", "reddetmek"],
      s: ["guarantee", "secure", "make sure"],
      o: "jeopardize, endanger (tehlikeye atmak)",
      e: [["to ensure that…", "The government has taken measures to ensure that all citizens have access to clean water.", "Hükümet, tüm vatandaşların temiz suya erişebilmesini sağlamak için önlemler aldı."],
          ["ensure the safety of", "New rules aim to ensure the safety of workers.", "Yeni kurallar işçilerin güvenliğini sağlamayı amaçlıyor."]],
      k: ["to ensure that…", "…masını sağlamak için"],
      n: "Resmi metinlerde amaç bildirir. Tuzak üçlüsü: assure (birine güvence vermek), insure (sigortalamak).",
      m: "EN-SURE: bir şeyi EN kesin (sure) hale getirmek, yani garanti altına almak." },

    { w: "enhance", p: "fiil", a: "artırmak, geliştirmek, iyileştirmek", f: 5,
      x: ["azaltmak, zayıflatmak", "gizlemek, saklamak", "tahliye etmek"],
      s: ["improve", "boost", "increase", "augment", "heighten", "strengthen"],
      o: "diminish, reduce (azaltmak), impair (zayıflatmak)",
      e: [["enhance + yetenek / nitelik", "Regular exercise can enhance memory and concentration.", "Düzenli egzersiz hafızayı ve konsantrasyonu geliştirebilir."],
          ["enhance the quality of", "Technology can enhance the quality of education.", "Teknoloji eğitimin kalitesini artırabilir."]],
      k: ["enhance the quality of", "…in kalitesini artırmak"],
      n: "Eş anlamlılar arasında en çok 'improve' ve 'augment' sorulur. Türevleri 'enhanced' ve 'enhancement' da son sınavlarda çıktı.",
      m: "İçinde 'chance' sesi var: en-HANCE, şansını EN yükseğe çıkarmak, yani artırmak." },

    { w: "illogical", p: "sıfat", a: "mantıksız, mantığa aykırı",
      x: ["kazançlı, kârlı", "kalıcı, uzun soluklu", "kötü şöhretli"],
      s: ["irrational", "unreasonable", "absurd", "unsound", "senseless"],
      o: "logical, rational, reasonable, sound",
      e: [["It is illogical to + fiil", "It is illogical to expect different results by repeating the same mistakes.", "Aynı hataları tekrarlayıp farklı sonuçlar beklemek mantıksızdır."],
          ["It seems illogical that…", "It seems illogical that the company cut its research budget during a crisis.", "Şirketin kriz döneminde araştırma bütçesini kesmesi mantıksız görünüyor."],
          ["an illogical conclusion", "The report reached an illogical conclusion.", "Rapor mantıksız bir sonuca vardı."]],
      k: ["an illogical conclusion", "mantıksız bir sonuç"],
      n: "il- olumsuzluk eki 'l' ile başlayan kelimelere gelir: illegal, illiterate. Akademik paragraflarda bir görüş eleştirilirken çıkar.",
      m: "IL-logical: 'logical' kapısına IL kilidi takılmış; mantık kapısı kilitli, yani mantıksız." },

    { w: "remunerative", p: "sıfat", a: "kazançlı, iyi para getiren",
      x: ["mantıksız", "engelleyici, önleyici", "endişe verici"],
      s: ["lucrative", "profitable", "well-paid", "gainful"],
      o: "unprofitable, unpaid",
      e: [["highly remunerative", "Software engineering has become a highly remunerative profession.", "Yazılım mühendisliği oldukça kazançlı bir meslek haline geldi."],
          ["remunerative employment", "Many graduates struggle to find remunerative employment.", "Pek çok mezun kazançlı bir iş bulmakta zorlanıyor."]],
      k: ["remunerative employment", "kazançlı iş, ücretli istihdam"],
      n: "İş ve ekonomi metinlerinde çıkar. Aynı aileden 'remuneration' (ücret, maaş) da sık sorulur.",
      m: "re-MUNE-rative: içinde MONEY sesi saklı; para getiren iş." },

    { w: "apprehension", p: "isim", a: "endişe, kaygı, tedirginlik",
      x: ["övgü, takdir", "sonuç, yansıma", "bilgelik, âlimlik"],
      s: ["anxiety", "unease", "fear", "dread", "misgiving"],
      o: "confidence, calm, reassurance",
      e: [["with apprehension", "Investors are watching the markets with apprehension.", "Yatırımcılar piyasaları endişeyle izliyor."],
          ["apprehension about / over", "There is growing apprehension about the effects of climate change.", "İklim değişikliğinin etkileri konusunda artan bir endişe var."]],
      k: ["a sense of apprehension", "bir endişe duygusu"],
      n: "Diğer anlamları: yakalama, tutuklama (arrest) ve nadiren kavrama. Sıfatı 'apprehensive about' (…konusunda endişeli) çok sık çıkar.",
      m: "APP-rehension: Banka APP'inden 'hesabınız bloke edildi' bildirimi geliyor; içini endişe kaplıyor." },

    { w: "pose", p: "fiil", a: "(tehdit, risk, sorun) oluşturmak", f: 1,
      x: ["ertelemek, askıya almak", "göz ardı etmek", "kutlamak"],
      s: ["constitute", "present", "create", "cause"],
      o: "eliminate, remove (ortadan kaldırmak)",
      e: [["pose a threat / risk to", "Air pollution poses a serious risk to public health.", "Hava kirliliği halk sağlığı için ciddi bir risk oluşturuyor."],
          ["pose a challenge", "Ageing populations pose a major challenge for governments.", "Yaşlanan nüfus hükümetler için büyük bir zorluk oluşturuyor."],
          ["pose as", "The thief posed as a police officer.", "Hırsız polis kılığına girdi."]],
      k: ["pose a threat to", "…için tehdit oluşturmak"],
      n: "Boşluktan sonra 'threat', 'risk' ya da 'challenge' görürsen ilk aday 'pose'. Diğer anlamlar: soru ortaya atmak (pose a question), poz vermek, pose as (…kılığına girmek).",
      m: "Objektife POZ veren dev bir canavar düşün: orada durması bile bir tehdit oluşturuyor." },

    { w: "dismiss", p: "fiil", a: "önemsememek, reddetmek, göz ardı etmek", f: 1,
      x: ["onaylamak, desteklemek", "tahliye etmek", "cezbetmek, ayartmak"],
      s: ["reject", "disregard", "discount", "rule out", "brush aside"],
      o: "accept, consider, take seriously",
      e: [["dismiss something as…", "Scientists dismissed the claim as unfounded.", "Bilim insanları iddiayı asılsız diyerek reddetti."],
          ["dismiss the possibility", "We cannot dismiss the possibility of a second wave.", "İkinci bir dalga olasılığını göz ardı edemeyiz."],
          ["be dismissed from", "He was dismissed from his job for misconduct.", "Kötü davranış nedeniyle işinden kovuldu."]],
      k: ["dismiss something as…", "bir şeyi … diyerek reddetmek"],
      n: "Diğer anlamlar: işten çıkarmak (fire, sack), davayı düşürmek, sınıfı dağıtmak. 'dismissive' (küçümseyen) ve 'dismissal' da çıkar.",
      m: "dis-MISS: fikri hiç dikkate almadan ıskalayıp (miss) yanından geçip gitmek." },

    { w: "tempt", p: "fiil", a: "cezbetmek, ayartmak, özendirmek",
      x: ["caydırmak, vazgeçirmek", "katlanmak, dayanmak", "söz vermek"],
      s: ["entice", "lure", "attract", "induce", "seduce"],
      o: "deter, discourage (caydırmak)",
      e: [["be tempted to", "Many students are tempted to cheat in exams.", "Pek çok öğrenci sınavlarda kopya çekmeye heveslenir."],
          ["tempt someone into + -ing", "Low prices tempt consumers into buying more.", "Düşük fiyatlar tüketicileri daha fazla almaya özendiriyor."],
          ["resist the temptation to", "Try to resist the temptation to check your phone.", "Telefonuna bakma isteğine direnmeye çalış."]],
      k: ["be tempted to", "bir şeyi yapmak içinden gelmek"],
      n: "'tempting' (cazip) ve 'temptation' (cazibe, ayartma) çok sık sorulur; 'a tempting offer' cazip teklif demek.",
      m: "TEMPerature: fırından yeni çıkmış sıcacık pidenin kokusu seni ayartıyor." },

    { w: "notorious", p: "sıfat", a: "kötü şöhretli, adı kötüye çıkmış", f: 3,
      x: ["ünlü ve saygın", "çok bilgili, âlim", "mantıksız"],
      s: ["infamous", "disreputable", "ill-famed"],
      o: "renowned, celebrated, eminent (olumlu anlamda ünlü)",
      e: [["notorious for", "The region is notorious for its high crime rate.", "Bölge, yüksek suç oranıyla kötü bir üne sahip."],
          ["a notorious + isim", "Police finally arrested the notorious criminal.", "Polis sonunda o kötü şöhretli suçluyu yakaladı."],
          ["notoriously difficult to", "Earthquakes are notoriously difficult to predict.", "Depremleri tahmin etmenin zorluğu herkesçe bilinir."]],
      k: ["notorious for", "… ile kötü bir üne sahip"],
      n: "'famous' gibi tanınmış demek ama hep olumsuz bir şeyle. Şıklarda 'famous' ve 'renowned' ile tuzak kurulur. Son sınavlarda en çok 'notoriously difficult to' çıktı.",
      m: "NOT-orious: 'NOT good' diye tanınan biri; adı kötüye çıkmış." },

    { w: "render", p: "fiil", a: "…hale getirmek, kılmak",
      x: ["kiralamak", "geri çekilmek", "tahliye etmek"],
      s: ["make", "leave", "cause to become"],
      o: "",
      e: [["render + isim + sıfat", "New technology has rendered many jobs obsolete.", "Yeni teknoloji pek çok işi demode hale getirdi."],
          ["render assistance", "Volunteers rendered assistance to the earthquake victims.", "Gönüllüler depremzedelere yardım sağladı."],

 terazi","s":["extent","scope","size","magnitude","range"],"o":"","e":[["on a large scale","The project was carried out on a large scale.","Proje büyük ölçekte yürütüldü."]],"k":["on a global scale","küresel ölçekte"],"n":"5 sınavda geçti. 'large-scale' (büyük çaplı) sıfatı da sık. 'scale back' küçültmek demek.","m":"Haritanın köşesindeki ölçek çizgisi.","f":5,"x":["zorluk, meydan okuma; sorgulamak, karşı çıkmak","talep, istek; talep etmek, gerektirmek","etki; etkilemek"]}]};

mpt someone to","The report prompted the government to act.","Rapor hükümeti harekete geçirdi."],["a prompt reply","Thank you for your prompt reply.","Hızlı cevabınız için teşekkürler."]],"k":["prompt someone to do something","birini bir şey yapmaya yöneltmek"],"n":"Hem fiil hem sıfat olarak sorulur. Zarf promptly (derhal) da kelime sorularında çıktı.","m":"Tiyatroda suflör (prompter) unutulan repliği anında fısıldar.","f":4,"x":["görmezden gelmek, yok saymak","oluşturmak, teşkil etmek","kazanmak, elde etmek; kazanç"]},{"w":"diversity","p":"isim","a":"çeşitlilik","s":["variety","range","multiplicity","heterogeneity"],"o":"uniformity, homogeneity","e":[["cultural diversity","The city is famous for its cultural diversity.","Şehir kültürel çeşitliliğiyle ünlü."]],"k":["biological diversity","biyolojik çeşitlilik"],"n":"Sıfat diverse (çeşitli), fiil diversify (çeşitlendirmek). biodiversity de çok çıkar.","m":"DIVERSE: farklı (different) renklerden oluşan bir mozaik.","f":4,"x":["sonuç, netice","istisna","bozukluk, rahatsızlık; düzensizlik"]},{"w":"excessive","p":"sıfat","a":"aşırı, fazla","s":["extreme","undue","inordinate","too much"],"o":"moderate, insufficient","e":[["excessive use of","Excessive use of antibiotics is dangerous.","Antibiyotiklerin aşırı kullanımı tehlikelidir."]],"k":["excessive consumption","aşırı tüketim"],"n":"İsim excess (fazlalık). 'in excess of' …den fazla demek.","m":"EXCESS: bagaj limitini aşan fazlalık.","f":4,"x":["zararlı, olumsuz etkili","bilişsel, zihinsel","çok sayıda, pek çok"]},{"w":"implication","p":"isim","a":"olası sonuç, etki; ima","s":["consequence","ramification","effect; suggestion","hint"],"o":"","e":[["implications for","The findings have important implications for education.","Bulguların eğitim için önemli sonuçları var."]],"k":["have implications for","…için sonuçları olmak"],"n":"Çoğunlukla çoğul kullanılır. Fiil imply (ima etmek).","m":"","f":4,"x":["besin maddesi, besin öğesi","ergenlik dönemi","maruz kalma; açığa çıkma" C["kart08"]={"title":"En sık çıkanlar 7","group":"En sık çıkanlar","words":[{"w":"ambiguous","p":"sıfat","a":"belirsiz, muğlak, iki anlamlı","s":["unclear","vague","equivocal","obscure"],"o":"clear, explicit, unambiguous","e":[["an ambiguous statement","The instructions were ambiguous.","Talimatlar muğlaktı."]],"k":["ambiguous results","belirsiz sonuçlar"],"n":"Kelime sorularında çıktı. İsim ambiguity (belirsizlik).","m":"AMBI (iki, ambivalent gibi): iki yöne çekilebilen.","f":2,"x":["tartışmalı, çekişmeli","yetersiz","geri döndürülemez"]},{"w":"assertion","p":"isim","a":"iddia, öne sürme","s":["claim","statement","declaration","allegation"],"o":"denial","e":[["the assertion that","There is no evidence for his assertion that the drug is safe.","İlacın güvenli olduğu iddiasına dair kanıt yok."]],"k":["make an assertion","bir iddiada bulunmak"],"n":"Kelime sorularında çıktı. Fiil assert, sıfat assertive (kendinden emin).","m":"","f":2,"x":["ipucu","eşitsizlik, fark, uçurum","norm, kural, standart; olağan durum"]},{"w":"carry out","p":"phrasal verb","a":"yürütmek, gerçekleştirmek, yapmak","s":["conduct","perform","execute","implement"],"o":"","e":[["carry out research","The study was carried out in ten countries.","Çalışma on ülkede yürütüldü."]],"k":["carry out an experiment","deney yapmak"],"n":"Kelime sorularında çıktı. conduct ile eş: carry out a survey, an investigation.","m":"","f":2,"x":["yoksun bırakmak, mahrum etmek","neden olmak, yol açmak; ikna etmek","yararlanmak, başvurmak, …e dayanmak"]},{"w":"cautious","p":"sıfat","a":"dikkatli, temkinli, ihtiyatlı","s":["careful","wary","prudent","vigilant"],"o":"careless, reckless","e":[["cautious about","Investors are cautious about the market.","Yatırımcılar piyasa konusunda temkinli."]],"k":["be cautious about","…konusunda temkinli olmak"],"n":"Kelime sorularında çıktı. İsim caution (dikkat, uyarı).","m":"CAUTION levhası: dikkat, kaygan zemin!","f":2,"x":["belirsiz, muğlak, iki anlamlı","yetersiz","tartışmalı, çekiş ağlık tesisi"],"n":"Kelime sorularında çıktı. Fiil facilitate (Kart 2).","m":"","f":1,"x":["(atık) imha, bertaraf; kullanım","çıkarım, sonuç çıkarma; kesinti","gelenek, âdet; (çoğul) gümrük"]},{"w":"fallacy","p":"isim","a":"yanılgı, yanlış inanış; mantık hatası","s":["misconception","myth","misbelief","error"],"o":"truth, fact","e":[["a common fallacy","It is a fallacy that money brings happiness.","Paranın mutluluk getirdiği bir yanılgıdır."]],"k":["a common fallacy","yaygın bir yanılgı"],"n":"Kelime sorularında çıktı. misconception ile eş. Sıfat fallacious.","m":"FALSE ile akraba: yanlış bir inanış.","x":["incelik, hassasiyet; özel lezzet","gelenek, âdet; (çoğul) gümrük","çıkarım, sonuç çıkarma; kesinti"]},{"w":"favourable","p":"sıfat","a":"elverişli, uygun; olumlu","s":["advantageous","beneficial","suitable; positive"],"o":"unfavourable, adverse","e":[["favourable conditions","The weather was favourable for sailing.","Hava yelken için elverişliydi."]],"k":["favourable conditions","elverişli koşullar"],"n":"Kelime sorularında çıktı. Amerikan yazımı favorable.","m":"","f":1,"x":["sindirilebilir, kolay hazmedilen","eşdeğer, denk; karşılık","açıklanabilir"]}]};
C["kart17"]={"title":"Kelime soruları 3","group":"Kelime soruları","words":[{"w":"feasible","p":"sıfat","a":"uygulanabilir, yapılabilir","s":["possible","practicable","viable","achievable","workable"],"o":"impossible, impractical","e":[["feasible + plan","The plan is technically feasible.","Plan teknik olarak uygulanabilir."]],"k":["economically feasible","ekonomik olarak uygulanabilir"],"n":"Kelime sorularında zarf feasibly çıktı. 'feasibility study' fizibilite çalışması.","m":"FİZİBİLİTE raporu: proje yapılabilir mi?","f":1,"x":["yaşanabilir, oturulabilir","bilgili","örtük, üstü kapalı, dolaylı"]},{"w":"fragmentation","p":"isim","a":"parçalanma, bölünme","s":["division","splitting","disintegration","breakup"],"o":"unification","e":[["habitat fragmentation","Habitat fragmentation threatens many species.","Yaşam alanlarının parçalanması pek çok türü tehdit ediyor."]],"k":["habitat fragmentation","yaşam alanının parçalanması"],"n":"Kelime sorularında çıktı. Fiil/isim fragment.","m":"","f":1,"x":["yaşam alanı, doğal ortam","dönüm noktası, kilometre taşı","tehlike, risk"]},{"w":"frequent","p":"sıfat","a":"sık, sık sık olan","s":["common","regular","recurrent","habitual"],"o":"rare, occasional","e":[["frequent + olay","Floods are frequent in this area.","Bu bölgede seller sık görülür."]],"k":["frequent visitor","sık gelen ziyaretçi"],"n":"Kelime sorularında çıktı. İsim frequency (sıklık).","m":"","f":1,"x":["uygulanabilir, yapılabilir","örtük, üstü kapalı, dolaylı","vazgeçilmez, zorunlu"]},{"w":"get over","p":"phrasal verb","a":"atlatmak, üstesinden gelmek, iyileşmek","s":["recover from","overcome","survive"],"o":"","e":[["get over + hastalık / üzüntü","It took her a long time to get over the flu.","Gribi atlatması uzun sürdü."]],"k":["get over a loss","bir kaybı atlatmak"],"n":"Kelime sorularında çıktı. recover from ile eş.","m":"","f":1,"x":["başlatmak, harekete geçirmek","(kuşaktan kuşağa) aktarmak; (karar) vermek","engellemek, sekteye uğratmak"]},{"w":"give away","p":"phrasal verb","a":"bedavaya vermek, bağışlamak; (sırrı) ele vermek","s":["donate","hand out; reveal","disclose","betray"],"o":"keep, conceal","e":[["give away + eşya","He gave away all his money to charity.","Bütün parasını hayır kurumuna bağışladı."],["give away a secret","Her face gave away her feelings.","Yüzü duygularını ele verdi."]],"k":["give away a secret","sırrı ele vermek"],"n":"Kelime sorularında çıktı. İsim giveaway (hediye; ipucu).","m":"","f":1,"x":["(kuşaktan kuşağa) aktarmak; (karar) vermek","ihmal etmek; ihmal","başlatmak, harekete geçirmek"]},{"w":"glacier","p":"isim","a":"buzul","s":["ice sheet","ice field","ice cap"],"o":"","e":[["melting glaciers","Glaciers are melting due to global warming.","Buzullar küresel ısınma yüzünden eriyor."]],"k":["glacier retreat","buzulların gerilemesi"],"n":"Kelime sorularında çıktı. Sıfat glacial (buzul; çok soğuk).","m":"","f":1,"x":["parçalanma, bölünme","yetersiz beslenme","yaşam alanı, doğal ortam"]},{"w":"habitable","p":"sıfat","a":"yaşanabilir, oturulabilir","s":["inhabitable","liveable","fit to live in"],"o":"uninhabitable","e":[["habitable planet","Scientists are searching for habitable planets.","Bilim insanları yaşanabilir gezegenler arıyor."]],"k":["habitable zone","yaşanabilir bölge"],"n":"Kelime sorularında çıktı. Dikkat: inhabitable de 'yaşanabilir' demek, zıddı uninhabitable.","m":"","f":1,"x":["tutarsız, çelişkili","cansız","ilk, başlangıçtaki"]},{"w":"habitat","p":"isim","a":"yaşam alanı, doğal ortam","s":["environment","home","territory","ecosystem"],"o":"","e":[["natural habitat","Pollution is destroying the bird's natural habitat.","Kirlilik kuşun doğal yaşam alanını yok ediyor."]],"k":["habitat loss","yaşam alanı kaybı"],"n":"Kelime sorularında çıktı.","m":"","f":1,"x":["tehlike, risk","teşvik, özendirme","yetersiz beslenme"]},{"w":"hamper","p":"fiil","a":"engellemek, sekteye uğratmak","s":["hinder","impede","obstruct","restrict"],"o":"facilitate, help","e":[["hamper + çaba","Heavy snow hampered rescue efforts.","Yoğun kar kurtarma çalışmalarını aksattı."]],"k":["hamper progress","ilerlemeyi engellemek"],"n":"Kelime sorularında çıktı; hinder ile eş. İsim olarak 'piknik sepeti' demek.","m":"","f":1,"x":["(kuşaktan kuşağa) aktarmak; (karar) vermek","ihmal etmek; ihmal","bedavaya vermek, bağışlamak; (sırrı) ele vermek"]},{"w":"hand down","p":"phrasal verb","a":"(kuşaktan kuşağa) aktarmak; (karar) vermek","s":["pass down","pass on","transmit","bequeath"],"o":"","e":[["hand down + gelenek","These recipes have been handed down for generations.","Bu tarifler nesilden nesile aktarıldı."]],"k":["be handed down from generation to generation","nesilden nesile aktarılmak"],"n":"Kelime sorularında çıktı; pass down ile eş.","m":"","f":1,"x":["birleşmek, kaynaşmak","engellemek, sekteye uğratmak","bedavaya vermek, bağışlamak; (sırrı) ele vermek"]},{"w":"hand out","p":"phrasal verb","a":"dağıtmak","s":["distribute","give out","hand round","dispense"],"o":"collect","e":[["hand out + eşya","The teacher handed out the exam papers.","Öğretmen sınav kâğıtlarını dağıttı."]],"k":["hand out leaflets","broşür dağıtmak"],"n":"Kelime sorularında çıktı. İsim handout (dağıtılan kâğıt; yardım).","m":"","f":1,"x":["bedavaya vermek, bağışlamak; (sırrı) ele vermek","başlatmak, harekete geçirmek","ihmal etmek; ihmal"]},{"w":"hazard","p":"isim","a":"tehlike, risk","s":["danger","risk","threat","peril"],"o":"safety","e":[["health hazard","Smoking is a serious health hazard.","Sigara ciddi bir sağlık tehlikesidir."]],"k":["pose a hazard","tehlike oluşturmak"],"n":"Kelime sorularında çıktı. Sıfat hazardous (tehlikeli).","m":"","f":1,"x":["yaşam alanı, doğal ortam","dönüm noktası, kilometre taşı","eğilim, meyil, istek"]},{"w":"illicit","p":"sıfat","a":"yasadışı, gayrimeşru","s":["illegal","unlawful","illegitimate","forbidden"],"o":"legal, lawful","e":[["illicit trade","The illicit trade in ivory threatens elephants.","Yasadışı fildişi ticareti filleri tehdit ediyor."]],"k":["illicit drugs", atic"],"o":"consistent","e":[["inconsistent with","His story is inconsistent with the evidence.","Anlattıkları kanıtlarla çelişiyor."]],"k":["be inconsistent with","…ile çelişmek"],"n":"Kelime sorularında çıktı. İsim inconsistency.","m":"","f":1,"x":["cansız","ilk, başlangıçtaki","örtük, üstü kapalı, dolaylı"]},{"w":"indispensable","p":"sıfat","a":"vazgeçilmez, zorunlu","s":["essential","vital","crucial","necessary"],"o":"dispensable, unnecessary","e":[["indispensable to / for","Water is indispensable for life.","Su yaşam için vazgeçilmezdir."]],"k":["indispensable tool","vazgeçilmez araç"],"n":"Kelime sorularında çıktı. Zıddı dispensable (Kart 16).","m":"","f":1,"x":["tutarsız, çelişkili","aşılmaz, üstesinden gelinemez","örtük, üstü kapalı, dolaylı"]},{"w":"initial","p":"sıfat","a":"ilk, başlangıçtaki","s":["first","early","opening","preliminary"],"o":"final","e":[["initial + aşama","The initial results were promising.","İlk sonuçlar umut vericiydi."]],"k":["at the initial stage","başlangıç aşamasında"],"n":"Kelime sorularında çıktı. Zarf initially. İsim olarak 'baş harf'.","m":"","f":1,"x":["olgun, yetişkin; olgunlaşmak","bilgili","yasadışı, gayrimeşru"]},{"w":"initiate","p":"fiil","a":"başlatmak, harekete geçirmek","s":["start","begin","launch","instigate","set up"],"o":"end, terminate","e":[["initiate + program","The government initiated a new health programme.","Hükümet yeni bir sağlık programı başlattı."]],"k":["initiate a process","bir süreç başlatmak"],"n":"Kelime sorularında çıktı. İsim initiative (girişim, inisiyatif).","m":"","f":1,"x":["engellemek, sekteye uğratmak","(kuşaktan kuşağa) aktarmak; (karar) vermek","bedavaya vermek, bağışlamak; (sırrı) ele vermek"]},{"w":"instantaneous","p":"sıfat","a":"anlık, anında olan","s":["immediate","instant","prompt","sudden"],"o":"delayed, gradual","e":[["instantaneous response","The effect of the drug was almost instantaneous.","İlacın etkisi neredeyse anındaydı."]],"k":["instantaneous communication","anlık iletişim C["kart52"]={"title":"Bağlaçlar ve zarflar 1","group":"Bağlaçlar ve zarflar","words":[{"w":"albeit","p":"bağlaç","a":"…se de, her ne kadar … olsa da","s":["although","though","even though","even if"],"o":"","e":[["albeit + sıfat / ifade","He accepted the job, albeit reluctantly.","İşi kabul etti, gönülsüz de olsa."]],"k":["albeit slowly","yavaş da olsa"],"n":"Ardından genelde sıfat, zarf ya da isim öbeği gelir, tam cümle değil. Resmi bir zıtlık bağlacı.","m":"ALL + BE + IT: hepsi böyle olsa bile.","x":["böylece, bu sayede, bu yolla","…şartıyla, …dığı takdirde","…mesin diye, …korkusuyla"]},{"w":"notwithstanding","p":"edat","a":"-e rağmen, …e karşın","s":["despite","in spite of","regardless of","nevertheless"],"o":"because of","e":[["notwithstanding + isim","Notwithstanding the difficulties, the project was completed.","Zorluklara rağmen proje tamamlandı."]],"k":["notwithstanding the fact that","…mesine rağmen"],"n":"Çok resmi; isimden sonra da gelebilir: the difficulties notwithstanding.","m":"NOT + WITHSTANDING: karşı durmasa da.","x":["her zaman, istisnasız","üstelik, ayrıca","ki onunla, …dığı (yöntem)"]},{"w":"nevertheless","p":"zarf","a":"yine de, buna rağmen","s":["nonetheless","however","still","even so"],"o":"","e":[["nevertheless","The test was difficult; nevertheless, she passed.","Sınav zordu; yine de geçti."]],"k":["but nevertheless","ama yine de"],"n":"Cümle başında virgülle: zıtlık bağlacı. nonetheless ile eş.","m":"","x":["…şartıyla, …dığı takdirde","…durumunda, …halinde","bu nedenle, bundan dolayı; bu yüzden"]},{"w":"nonetheless","p":"zarf","a":"yine de, her şeye rağmen","s":["nevertheless","however","still","even so"],"o":"","e":[["nonetheless","The plan is risky. Nonetheless, we will try.","Plan riskli. Yine de deneyeceğiz."]],"k":["nonetheless important","yine de önemli"],"n":"nevertheless ile tamamen eş.","m":"NONE + THE + LESS: hiç de azalmadan.","x":["…ışığında, …göz önüne alındığında","ki onunla, …dığı (yöntem)","…nedeniyle, …yüzünden"]},{"w":"hence","p":"zarf","a":"bu nedenle, bundan dolayı; bu yüzden","s":["therefore","thus","consequently","as a result"],"o":"","e":[["hence","The road was icy, hence the accident.","Yol buzluydu, kaza bu yüzden oldu."]],"k":["hence the name","adı da buradan gelir"],"n":"Ardından sadece isim de gelebilir: hence the delay. Zaman için 'two weeks hence' (iki hafta sonra).","m":"","x":["…se de, her ne kadar … olsa da","ki onunla, …dığı (yöntem)","kaçınılmaz olarak"]},{"w":"thereby","p":"zarf","a":"böylece, bu sayede, bu yolla","s":["thus","by that means","as a result"],"o":"","e":[["thereby + -ing","He signed the contract, thereby accepting the terms.","Sözleşmeyi imzaladı, böylece şartları kabul etmiş oldu."]],"k":["thereby reducing","böylece azaltarak"],"n":"Ardından sık sık -ing gelir.","m":"THERE + BY: onun aracılığıyla.","x":["…dığı sürece, …şartıyla","…sayesinde, …nedeniyle, …sıfatıyla","…ile ilgili olarak, …konusunda"]},{"w":"whereby","p":"zarf","a":"ki onunla, …dığı (yöntem)","s":["by which","through which","according to which"],"o":"","e":[["a system whereby","They introduced a system whereby workers can share profits.","İşçilerin kârı paylaşabildiği bir sistem getirdiler."]],"k":["a system whereby","…dığı bir sistem"],"n":"'by which' anlamında ilgi zarfı.","m":"","x":["…medikçe, …mezse","…se de, her ne kadar … olsa da","üstelik, ayrıca"]},{"w":"provided that","p":"bağlaç","a":"…şartıyla, …dığı takdirde","s":["on condition that","as long as","if","providing"],"o":"unless","e":[["provided that + cümle","You can go out provided that you finish your homework.","Ödevini bitirmen şartıyla dışarı çıkabilirsin."]],"k":["provided that","şartıyla"],"n":"'providing that' ile eş. Koşul bağlacı.","m":"","x":["yine de, buna rağmen","…den dolayı, yüzünden","…in aksine"]},{"w":"as long as","p":"bağlaç","a":"…dığı sürece, …şartıyla","s":["provided that","on condition that","so long as"],"o":"unless","e":[["as long as + cümle","You can stay as long as you are quiet.","Sessiz olduğun s özellikle","…den kaynaklanmak, …de ortaya çıkmak","…e yatkın, …e eğilimli"]},{"w":"that is to say","p":"kalıp","a":"yani, demek oluyor ki","s":["in other words","namely","i.e.","to be precise"],"o":"","e":[["that is to say","He is a polyglot, that is to say, he speaks many languages.","Çok dilli, yani pek çok dil konuşuyor."]],"k":["that is to say","şöyle ki"],"n":"'that is' ve 'i.e.' de aynı anlamda.","m":"","x":["özellikle","arıtmak; geliştirmek, inceltmek","patlamak, havaya uçurmak; öfkelenmek; büyütmek"]},{"w":"still","p":"zarf","a":"hâlâ; yine de","s":["yet","even now; nevertheless","however"],"o":"","e":[["still","It is still raining.","Hâlâ yağmur yağıyor."],["still + zıtlık","The plan was risky. Still, it worked.","Plan riskliydi. Yine de işe yaradı."]],"k":["still","yine de"],"n":"Bağlaç olarak 'nevertheless' anlamı sık.","m":"","x":["ondan sonra, sonrasında","şimdiye kadar, o zamana dek","…dışında, …hariç; …nın yanı sıra"]},{"w":"yet","p":"zarf / bağlaç","a":"henüz; ama, yine de","s":["so far","until now; but","however","nevertheless"],"o":"","e":[["not yet","He hasn't arrived yet.","Henüz gelmedi."],["yet + zıtlık","The task was hard, yet they finished it.","İş zordu, yine de bitirdiler."]],"k":["and yet","ama yine de"],"n":"Bağlaç olarak 'but' anlamında.","m":"","x":["…in aksine, …e karşın","…in yokluğunda, …olmadığında","…e kadar; bildiğim kadarıyla, …açısından"]},{"w":"thereafter","p":"zarf","a":"ondan sonra, sonrasında","s":["afterwards","subsequently","later","from then on"],"o":"beforehand","e":[["thereafter","He moved to Paris in 1990 and lived there thereafter.","1990'da Paris'e taşındı ve ondan sonra orada yaşadı."]],"k":["shortly thereafter","kısa süre sonra"],"n":"Resmi; subsequently ile eş.","m":"","x":["…in aksine, …e karşın","…dışında, …hariç; …nın yanı sıra","…nedeniyle, yüzünden"]},{"w":"hitherto","p":"zarf","a":"şimdiye kadar, o zamana dek","s":["until now","so far","previously","up to now"],"o":"","e":[["hitherto + sıfat","The study revealed hitherto unknown facts.","Çalışma şimdiye kadar bilinmeyen gerçekleri ortaya koydu."]],"k":["hitherto unknown","şimdiye kadar bilinmeyen"],"n":"Çok resmi; 'so far' ile eş.","m":"","x":["…ile orantılı olarak","…in ardından, …sonrasında","…hariç, …dışında"]}]};
C["kart54"]={"title":"Bağlaçlar ve zarflar 3","group":"Bağlaçlar ve zarflar","words":[{"w":"henceforth","p":"zarf","a":"bundan böyle, bundan sonra","s":["from now on","in future","hereafter"],"o":"previously","e":[["henceforth","Henceforth, all meetings will be held online.","Bundan böyle tüm toplantılar çevrimiçi yapılacak."]],"k":["henceforth","bundan sonra"],"n":"Resmi; 'from now on' ile eş.","m":"","x":["kabul etmek gerekir ki","sadece … değil, aynı zamanda … de","başlangıçta, ilk başta"]},{"w":"subsequently","p":"zarf","a":"daha sonra, akabinde","s":["later","afterwards","then","thereafter"],"o":"previously, earlier","e":[["subsequently","He was arrested and subsequently released.","Tutuklandı ve daha sonra serbest bırakıldı."]],"k":["subsequently","sonradan"],"n":"Sıfat subsequent (Kart 41).","m":"","x":["iddiaya göre","tamamen, büsbütün","özellikle","belirgin şekilde"]},{"w":"ultimately","p":"zarf","a":"sonunda, nihayetinde; temelde","s":["eventually","finally","in the end; fundamentally"],"o":"initially","e":[["ultimately","Ultimately, the decision is yours.","Sonuçta karar senin."]],"k":["ultimately responsible","nihai sorumlu"],"n":"Sıfat ultimate (Kart 14).","m":"","f":1,"x":["büyük ölçüde, önemli miktarda","paradoksal olarak, çelişkili bir şekilde","iddiaya göre"]},{"w":"readily","p":"zarf","a":"kolayca; isteyerek, hemen","s":["easily","freely; willingly","gladly"],"o":"reluctantly","e":[["readily available","The information is readily available online.","Bilgiye internetten kolayca ulaşılabilir."]],"k":["readily available","kolayca bulunabilen"],"n":"'readily admit' çekinmeden kabul etmek.","m":"","x":["sonunda, nihayetinde; temelde","alternatif olarak, ya da","ne … ne de"]},{"w":"scarcely","p":"zarf","a":"ancak, neredeyse hiç, zar zor","s":["hardly","barely","only just"],"o":"","e":[["scarcely + fiil","I could scarcely believe it.","Neredeyse inanamadım."]],"k":["scarcely … when","tam …mişti ki"],"n":"Olumsuz anlamlı; cümle başında devrik: Scarcely had he arrived when…","m":"","x":["madem ki, artık …dığına göre","tamamen, büsbütün","benzer şekilde"]},{"w":"substantially","p":"zarf","a":"büyük ölçüde, önemli miktarda","s":["considerably","significantly","greatly","markedly"],"o":"slightly","e":[["substantially + fiil","Prices have increased substantially.","Fiyatlar büyük ölçüde arttı."]],"k":["substantially reduce","önemli ölçüde azaltmak"],"n":"Sıfat substantial (Kart 3).","m":"","f":3,"x":["sonunda, nihayetinde; temelde","daha sonra, akabinde","benzer şekilde"]},{"w":"notably","p":"zarf","a":"özellikle; belirgin şekilde","s":["particularly","especially; remarkably","markedly"],"o":"","e":[["notably","Many countries, notably France, opposed the plan.","Başta Fransa olmak üzere pek çok ülke plana karşı çıktı."]],"k":["most notably","en başta"],"n":"Sıfat notable (Kart 27).","m":"","x":["kolayca; isteyerek, hemen","büyük ölçüde, çoğunlukla","ancak, neredeyse hiç, zar zor"]},{"w":"roughly","p":"zarf","a":"yaklaşık olarak, kabaca; sertçe","s":["approximately","about","around; harshly"],"o":"exactly, precisely","e":[["roughly + sayı","The trip takes roughly three hours.","Yolculuk yaklaşık üç saat sürer."]],"k":["roughly speaking","kabaca söylemek gerekirse"],"n":"approximately ile eş (Kart 15).","m":"","x":["büyük ölçüde, çoğunlukla","ne … ne de","sonunda, nihayetinde; temelde"]},{"w":"primarily","p":"zarf","a":"öncelikle, esas olarak","s":["mainly","chiefly","principally","largely"],"o":"secondarily","e":[["primarily + neden","The book is primarily for beginners.","Kitap öncelikle yeni başlayanlar için."]],"k":["primarily responsible","esas sorumlu"],"n":"Sınavlarda kelime sorusu olarak çıktı. Sıfat primary (Kart 4).","m":"","f":2,"x":["ne … ne de","özellikle; belirgin şekilde","başlangıçta, ilk başta"]},{"w":"largely","p":"zarf","a":"büyük ölçüde, çoğunlukla","s":["mainly","mostly","chiefly","to a great extent"],"o":"slightly","e":[["largely + neden","The success was largely due to hard work.","Başarı büyük ölçüde amentally","primarily","in essence"],"o":"","e":[["essentially","The two ideas are essentially the same.","İki fikir esasen aynı."]],"k":["essentially the same","temelde aynı"],"n":"Sıfat essential (Kart 11).","m":"","x":["yaklaşık olarak, kabaca; sertçe","tamamen, büsbütün","iddiaya göre"]},{"w":"paradoxically","p":"zarf","a":"paradoksal olarak, çelişkili bir şekilde","s":["ironically","surprisingly","unexpectedly"],"o":"","e":[["paradoxically","Paradoxically, the more you rest, the more tired you feel.","Çelişkili bir şekilde, ne kadar dinlenirsen o kadar yorgun hissedersin."]],"k":["paradoxically","işin ilginci"],"n":"İsim paradox (Kart 47).","m":"","x":["sadece … değil, aynı zamanda … de","alternatif olarak, ya da","ancak, neredeyse hiç, zar zor"]},{"w":"exceedingly","p":"zarf","a":"son derece, aşırı derecede","s":["extremely","very","exceptionally","remarkably"],"o":"slightly","e":[["exceedingly + sıfat","It is exceedingly difficult to find a job.","İş bulmak son derece zor."]],"k":["exceedingly rare","son derece nadir"],"n":"Fiil exceed (Kart 35).","m":"","x":["büyük ölçüde, önemli miktarda","başlangıçta, ilk başta","benzer şekilde"]},{"w":"utterly","p":"zarf","a":"tamamen, büsbütün","s":["completely","totally","absolutely","entirely"],"o":"partly","e":[["utterly + sıfat","The plan was utterly ridiculous.","Plan tamamen saçmaydı."]],"k":["utterly impossible","tamamen imkânsız"],"n":"Genelde olumsuz sıfatlarla.","m":"","x":["bu arada, o sırada","sonunda, nihayetinde; temelde","…olsun ya da olmasın"]},{"w":"insofar as","p":"bağlaç","a":"…dığı ölçüde, …dığı kadarıyla","s":["to the extent that","as far as","in that"],"o":"","e":[["insofar as + cümle","I will help insofar as I can.","Elimden geldiği ölçüde yardım edeceğim."]],"k":["insofar as","…dığı ölçüde"],"n":"Resmi; as far as ile eş.","m":"","x":["sadece … değil, aynı zamanda … de","özellikle; belirgin şekilde","bildirildiğine göre, haberlere göre"]},{"w":"inasmuch as","p":"bağlaç","a":"…dığı için, …dığından","s":["since","because","seeing that","considering that"],"o":"","e":[["inasmuch as + cümle","Inasmuch as you are the leader, you are responsible.","Lider sen olduğun için sorumlu sensin."]],"k":["inasmuch as","…dığından"],"n":"Çok resmi neden bağlacı.","m":"","x":["alternatif olarak, ya da","sadece … değil, aynı zamanda … de","benzer şekilde"]},{"w":"now that","p":"bağlaç","a":"madem ki, artık …dığına göre","s":["since","as","seeing that"],"o":"","e":[["now that + cümle","Now that you are here, we can start.","Madem geldin, başlayabiliriz."]],"k":["now that","artık …dığına göre"],"n":"Neden bildirir.","m":"","x":["ne … ne de","alternatif olarak, ya da","paradoksal olarak, çelişkili bir şekilde"]},{"w":"whether or not","p":"bağlaç","a":"…olsun ya da olmasın","s":["regardless of whether","if"],"o":"","e":[["whether or not + cümle","Whether or not you agree, we will go.","Katılsan da katılmasan da gideceğiz."]],"k":["whether or not","olsa da olmasa da"],"n":"'whether … or not' şeklinde de kullanılır.","m":"","x":["iddiaya göre","esasen, temelde","benzer şekilde"]},{"w":"no matter how","p":"bağlaç","a":"ne kadar … olursa olsun","s":["however","regardless of how"],"o":"","e":[["no matter how + sıfat","No matter how hard I try, I can't do it.","Ne kadar uğraşırsam uğraşayım yapamıyorum."]],"k":["no matter how hard","ne kadar zor olursa olsun"],"n":"'however' ile eş: However hard I try…","m":"","f":1,"x":["daha sonra, akabinde","öncelikle, esas olarak","ne … ne de"]},{"w":"not only ... but also","p":"bağlaç","a":"sadece … değil, aynı zamanda … de","s":["both … and","as well as"],"o":"","e":[["not only A but also B","She is not only clever but also kind.","Sadece zeki değil, aynı zamanda nazik."]],"k":["not only … but also","yalnızca … değil, … da"],"n":"Cümle başında devrik yapı: Not only did he win…","m":"","x":["sonunda, nihayetinde; temelde","alternatif olarak, ya da","…olsun ya da olmasın"]},{"w":"neither ... nor","p":"bağlaç","a":"ne … ne de","s":["not either … or"]," <script>
(function () {
  "use strict";

  /* ---------- Deck ---------- */
  var CARDS = window.YDS_CARDS || {};
  if (CARDS.kart01) CARDS.kart01.group = "Başlangıç";
  var DECK = window.YDS_PLAN || [{ id: "kart01", n: 1, group: "Başlangıç", k: 1 }];
  var GROUPS = window.YDS_GROUPS || { "Başlangıç": "Birlikte çalıştığımız kelimeler" };
  function cardLabel(cid) {
    var d = DECK.filter(function (x) { return x.id === cid; })[0], c = CARDS[cid];
    return "Kart " + (d ? d.n : Number(cid.slice(4))) + (c ? " · " + c.title : "");
  }
  var BY = {}; // cardId -> {word -> entry}
  Object.keys(CARDS).forEach(function (cid) {
    BY[cid] = {};
    CARDS[cid].words.forEach(function (w) { BY[cid][w.w] = w; });
  });
  function entry(it) { return BY[it.cid] && BY[it.cid][it.w]; }

  /* ---------- Progress (this browser, plus the account when available) ---------- */
  var LS = "yds-kelime-progress-v1";
  var progress = { cards: {}, updatedAt: 0 };
  try { var raw = localStorage.getItem(LS); if (raw) progress = JSON.parse(raw) || progress; } catch (e) {}
  if (!progress.cards) progress.cards = {};
  var remoteRef = null, synced = false, writing = false, dirty = false, timer = null;

  function cp(cid) { return progress.cards[cid] || (progress.cards[cid] = { best: 0, runs: 0, wrong: [] }); }
  function save() {
    progress.updatedAt = Date.now();
    try { localStorage.setItem(LS, JSON.stringify(progress)); } catch (e) {}
    if (remoteRef) { clearTimeout(timer); timer = setTimeout(pushRemote, 1200); }
  }
  function pushRemote() {
    if (!remoteRef) return;
    if (writing) { dirty = true; return; }
    writing = true; dirty = false;
    remoteRef.set(JSON.parse(JSON.stringify(progress))).catch(function () {}).then(function () {
      writing = false; if (dirty) pushRemote();
    });
  }
  (async function connect() {
    try {
      if (!window.claude || !window.claude.use) return;
      var got = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      var db = got[0], user = got[1];
      if (!db || !user) return;
      var id = await user.id();
      if (!id) return;
      var ref = db.doc("data/users/" + id + "/progress");
      var snap = await ref.get();
      remoteRef = ref; synced = true;
      var r = snap.exists ? snap.data() : null;
      if (r && (r.updatedAt || 0) > (progress.updatedAt || 0)) {
        progress = JSON.parse(JSON.stringify(r));
        if (!progress.cards) progress.cards = {};
        try { localStorage.setItem(LS, JSON.stringify(progress)); } catch (e) {}
      } else if (progress.updatedAt) {
        pushRemote();
      }
      if (view === "home") render();
    } catch (e) {}
  })();

  /* ---------- Helpers ---------- */
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  var canSpeak = "speechSynthesis" in window;
  function say(t) {
    try { var u = new SpeechSynthesisUtterance(t); u.lang = "en-US"; u.rate = 0.9; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {}
  }
  var SPEAKER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
  var LETTERS = ["A", "B", "C", "D"];
  function allWrong() {
    var out = [];
    DECK.forEach(function (d) {
      var p = progress.cards[d.id];
      if (p && CARDS[d.id]) p.wrong.forEach(function (w) { if (BY[d.id][w]) out.push({ cid: d.id, w: w }); });
    });
    return out;
  }

  /* ---------- Sessions ---------- */
  var view = "home", S = null;
  var app = document.getElementById("app");

  function start(mode, cid) {

      items = CARDS[cid].words.map(function (w) { return { cid: cid, w: w.w }; });
      label = cardLabel(cid);
    } else if (mode === "review") {
      items = cp(cid).wrong.filter(function (w) { return BY[cid][w]; }).map(function (w) { return { cid: cid, w: w }; });
      label = "Kart " + Number(cid.slice(4)) + " · Yanlışlar";
    } else if (mode === "mix") {
      items = [];
      Object.keys(CARDS).forEach(function (c) { CARDS[c].words.forEach(function (w) { items.push({ cid: c, w: w.w }); }); });
      items = shuffle(items).slice(0, 30);
      label = "Karışık 30";
    } else {
      items = allWrong();
      label = "Tüm yanlışlar";
    }
    if (!items.length) return;
    S = { mode: mode, cid: cid || null, label: label, items: shuffle(items), i: 0, picks: [], orders: [], right: 0, missed: [] };
    view = "quiz";
    render(); window.scrollTo(0, 0);
  }

  function ensureOrder() {
    if (!S.orders[S.i]) {
      var e = entry(S.items[S.i]);
      S.orders[S.i] = shuffle([{ t: e.a, ok: true }].concat(e.x.slice(0, 3).map(function (t) { return { t: t, ok: false }; })));
    }
    return S.orders[S.i];
  }

  function answer(k) {
    if (view !== "quiz" || S.picks[S.i] != null) return;
    var order = ensureOrder(); if (!order[k]) return;
    S.picks[S.i] = k;
    var it = S.items[S.i], p = cp(it.cid), at = p.wrong.indexOf(it.w);
    if (order[k].ok) { S.right++; if (at >= 0) p.wrong.splice(at, 1); }
    else { S.missed.push(it); if (at < 0) p.wrong.push(it.w); }
    save();
    render();
    var nb = document.getElementById("next"); if (nb) nb.focus({ preventScroll: true });
  }

  function next() {
    if (view !== "quiz" || S.picks[S.i] == null) return;
    if (S.i < S.items.length - 1) { S.i++; render(); window.scrollTo(0, 0); return; }
    if (S.mode === "full") { var p = cp(S.cid); p.runs++; if (S.right > p.best) p.best = S.right; save(); }
    view = "done"; render(); window.scrollTo(0, 0);
  }

  /* ---------- Views ---------- */
  function renderHome() {
    var miss = allWrong().length, ready = 0, words = 0, done = 0;
    var order = [], byGroup = {};
    DECK.forEach(function (d) {
      if (!byGroup[d.group]) { byGroup[d.group] = []; order.push(d.group); }
      byGroup[d.group].push(d);
      if (CARDS[d.id]) { ready++; words += CARDS[d.id].words.length; if ((progress.cards[d.id] || {}).runs) done++; }
    });
    var sections = order.map(function (g) {
      var list = byGroup[g], gDone = 0;
      var rows = list.map(function (d) {
        var c = CARDS[d.id];
        if (!c) return '<div class="rowc locked"><div class="info"><span class="name">Kart ' + d.n + '</span><span class="sub">Hazırlanıyor</span></div></div>';
        var p = progress.cards[d.id] || { best: 0, runs: 0, wrong: [] };
        if (p.runs) gDone++;
        var total = c.words.length, wr = p.wrong.filter(function (w) { return BY[d.id][w]; }).length;
        var status = p.runs ? "En iyi " + p.best + "/" + total + (wr ? " · " + wr + " yanlış" : "") : (wr ? wr + " yanlış · bitirilmedi" : total + " kelime · henüz çözülmedi");
        return '<div class="rowc"><div class="info"><span class="name">Kart ' + d.n + (list.length > 1 ? "" : " · " + esc(c.title)) + '</span>' +
          '<div class="meter" aria-hidden="true"><i style="width:' + Math.round(100 * p.best / total) + '%"></i></div>' +
          '<span class="sub">' + esc(status) + '</span></div><div class="acts">' +
          '<button class="btn primary" data-act="full" data-cid="' + d.id + '">' + (p.runs ? "Tekrar" : "Başla") + '</button>' +
          (wr ? '<button class="btn" data-act="review" data-cid="' + d.id + '">Yanlışlar (' + wr + ')</button>' : "") + '</div></div>';
      }).join("");
      var first = list[0].n, last = list[list.length - 1].n;
      return '<section class="group"><div class="group-head"><h2>' + esc(g) + '</h2>' +
        '<span class="count">Kart ' + first + (last > first ? "–" + last : "") + ' · ' + gDone + '/' + list.length + ' bitti</span>' +
        (GROUPS[g] ? '<p>' + esc(GROUPS[g]) + '</p>' : "") + '</div><div class="rows">' + rows + '</div></section>';
    }).join("");
    return '<main class="wrap page">' +
      '<header class="hero"><span class="label">YDS · kelime programı</span><h1>Kelime Kartları</h1>' +
      '<p>' + DECK.length + ' kart, ' + DECK.length * 30 + ' kelime. Hazır: ' + ready + ' kart, ' + words + ' kelime · bitirdiğin: ' + done + ' kart. ' +
      'Kelimeyi gör, dört anlamdan doğrusunu seç, sonra eş anlamlıları, kalıpları ve hatırlatıcıyı oku.</p></header>' +
      '<section class="review"><span>Yanlış listen: <b>' + miss + '</b> kelime</span><div class="acts">' +
      '<button class="btn" data-act="all"' + (miss ? "" : " disabled") + '>Yanlışları tekrar et</button>' +
      '<button class="btn primary" data-act="mix">Karışık 30 kelime</button></div></section>' +
      sections +
      '<p class="foot">' + (synced ? "İlerlemen hesabına kaydediliyor; telefonda ve bilgisayarda aynı kalır." : "İlerlemen bu tarayıcıda saklanıyor.") +
      ' Sıklık etiketleri Kelime Röntgeni listelerine (2022/1–2025/3, 9 sınav) göre hesaplandı.</p>' +
      '</main>';
  }

  function renderQuiz() {
    var it = S.items[S.i], e = entry(it), order = ensureOrder(), pick = S.picks[S.i], done = pick != null;
    var opts = order.map(function (o, k) {
      var cls = "opt";
      if (done) cls += o.ok ? " is-correct" : (k === pick ? " is-wrong" : " is-dim");
      return '<li><button class="' + cls + '" data-act="pick" data-k="' + k + '"' + (done ? " disabled" : "") + '>' +
        '<span class="bub">' + LETTERS[k] + '</span><span>' + esc(o.t) + '</span></button></li>';
    }).join("");
    var right = done && order[pick].ok;
    var info = "";
    if (done) {
      var uses = e.e.map(function (u) {
        return '<li><span class="pat">' + esc(u[0]) + '</span><span class="en">' + esc(u[1]) + '</span><span class="tr">' + esc(u[2]) + '</span></li>';
      }).join("");
      info = '<section class="entry" aria-live="polite">' +
        '<div><span class="verdict ' + (right ? "ok" : "no") + '">' + (right ? "Doğru!" : "Yanlış. Doğru cevap yeşil işaretli.") + '</span>' +
        '<p class="mean">' + esc(e.w) + ' = ' + esc(e.a) + '</p></div>' +
        '<div class="sec"><span class="label">Eş anlamlıları (YDS’de en sık çıkanlar)</span><div class="chips">' +
        e.s.map(function (s) { return '<span class="chip">' + esc(s) + '</span>'; }).join("") + '</div></div>' +
        (e.o ? '<div class="sec"><span class="label">Zıt anlamlıları</span><p>' + esc(e.o) + '</p></div>' : "") +
        '<div class="sec"><span class="label">Cümle içinde en sık kullanımları</span><ul class="uses">' + uses + '</ul></div>' +
        '<div class="sec"><span class="label">En akılda kalıcı kalıp</span><div class="keybox"><b>' + esc(e.k[0]) + '</b><span>' + esc(e.k[1]) + '</span></div></div>' +
        (e.n ? '<div class="sec"><span class="label">YDS notu</span><p>' + esc(e.n) + '</p></div>' : "") +
        (e.m ? '<div class="sec"><span class="label">Hatırlatıcı</span><p class="hint">' + esc(e.m) + '</p></div>' : "") +
        '</section>';
    }
    var last = S.i === S.items.length - 1;
    return '<div class="bar"><div class="wrap"><button class="back" data-act="home">← Kartlar</button>' +
      '<span class="where">' + esc(S.label) + '</span>' +
      '<span class="tally" aria-label="Doğru ve yanlış sayısı"><span class="ok">✓ ' + S.right + '</span><span class="no">✗ ' + S.missed.length + '</span></span></div>' +
      '<div class="track"><i style="width:' + Math.round(100 * (S.i + (done ? 1 : 0)) / S.items.length) + '%"></i></div></div>' +
      '<main class="wrap page">' +
      '<div class="qhead"><span class="label">Soru ' + (S.i + 1) + ' / ' + S.items.length + '</span>' +
      '<h1 class="word" lang="en">' + esc(e.w) + '</h1>' +
      '<div class="meta"><span class="pos">' + esc(e.p) + '</span>' +
      (canSpeak ? '<button class="say" data-act="say">' + SPEAKER + 'Dinle</button>' : "") +
      (e.f ? '<span class="freq" title="Kelime Röntgeni listelerine göre">2022–25 YDS: ' + e.f + '/9 sınavda</span>' : "") + '</div></div>' +
      '<ol class="opts" aria-label="Seçenekler">' + opts + '</ol>' +
      info + '</main>' +
      (done ? '<div class="nextbar"><div class="wrap"><button id="next" class="btn primary" data-act="next">' +
        (last ? "Sonucu gör" : "Sonraki kelime →") + '</button><span class="kbd">Enter</span></div></div>' : "");
  }

  function renderDone() {
    var total = S.items.length, pct = Math.round(100 * S.right / total);
    var msg = pct === 100 ? "Hepsi doğru. Bu kart cepte." : pct >= 80 ? "Çok iyi. Kalan birkaç kelimeyi tekrar et." : pct >= 50 ? "Fena değil. Yanlışları bir tur daha çöz." : "Bu kartı biraz daha çalışalım.";
    var misses = S.missed.map(function (it) { var e = entry(it); return '<li><b lang="en">' + esc(e.w) + '</b><span>' + esc(e.a) + '</span></li>'; }).join("");
    var cardWrong = S.cid ? cp(S.cid).wrong.length : allWrong().length;
    return '<main class="wrap page">' +
      '<header class="hero"><span class="label">' + esc(S.label) + '</span>' +
      '<p class="score">' + S.right + '<small> / ' + total + '</small></p><p>' + msg + '</p></header>' +
      (misses ? '<section class="sec"><span class="label">Bu turda yanlış yaptıkların</span><ul class="misses">' + misses + '</ul></section>' : "") +
      '<div class="actions">' +
      (cardWrong ? '<button class="btn primary" data-act="' + (S.cid ? "review" : "all") + '"' + (S.cid ? ' data-cid="' + S.cid + '"' : "") + '>Yanlışları tekrar et (' + cardWrong + ')</button>' : "") +
      (S.cid ? '<button class="btn" data-act="full" data-cid="' + S.cid + '">Kartı baştan çöz</button>' : "") +
      (S.mode === "mix" ? '<button class="btn" data-act="mix">Yeni karışık 30</button>' : "") +
      '<button class="btn" data-act="home">Kartlara dön</button></div></main>';
  }

  function render() {
    app.innerHTML = view === "quiz" ? renderQuiz() : view === "done" ? renderDone() : renderHome();
  }

  /* ---------- Events ---------- */
  app.addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-act]"); if (!b || b.disabled) return;
    var act = b.getAttribute("data-act"), cid = b.getAttribute("data-cid");
    if (act === "pick") answer(Number(b.getAttribute("data-k")));
    else if (act === "next") next();
    else if (act === "say") say(entry(S.items[S.i]).w);
    else if (act === "home") { view = "home"; S = null; render(); window.scrollTo(0, 0); }
    else if (act === "full" || act === "review") start(act, cid);
    else if (act === "all") start("all");
    else if (act === "mix") start("mix");
  });
  document.addEventListener("keydown", function (ev) {
    if (view !== "quiz" || ev.metaKey || ev.ctrlKey || ev.altKey) return;
    var k = ev.key.toLowerCase(), idx = { "1": 0, "2": 1, "3": 2, "4": 3, a: 0, b: 1, c: 2, d: 3 }[k];
    if (idx != null && S.picks[S.i] == null) { ev.preventDefault(); answer(idx); }
    else if ((k === "enter" || k === "arrowright") && S.picks[S.i] != null) { ev.preventDefault(); next(); }
  });

  /* ---------- Boot (keeps an open quiz across republishes) ---------- */
  var hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) { try { hot.snapshot(function () { return { view: view, S: S }; }); } catch (e) {} }
  function boot(data) {
    if (data && data.S && data.S.items && data.S.items.every(entry)) { S = data.S; view = data.view || "quiz"; }
    render();
  }
  if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
})();
</script>
</body>
</html>
